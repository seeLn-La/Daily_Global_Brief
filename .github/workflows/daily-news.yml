name: Daily News Aggregation

on:
  schedule:
    - cron: '0 2 * * *'  # UTC 02:00 = 北京时间 10:00, 预留2小时确保中午12点前数据就绪
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run news aggregator
        run: python scripts/aggregator.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Daily news: $(date +%Y-%m-%d)"
            git push
          fi

      # Bark 推送已迁移至 macOS 本地定时任务（noon_push.py + launchd）
      # 确保每天中午 12:00 北京时间准时推送，不受 GitHub Actions 调度延迟影响
