name: Daily News Aggregation

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/argos-translate
          key: argos-translate-en-zh-v1-${{ runner.os }}

      - name: Prepare offline translation model
        run: |
          python - <<'PY'
          import argostranslate.package

          installed = argostranslate.package.get_installed_packages()
          has_english_to_chinese = any(
              package.from_code == "en" and package.to_code == "zh"
              for package in installed
          )

          if has_english_to_chinese:
              print("离线中英翻译模型已从缓存恢复。")
          else:
              print("首次运行，正在下载离线中英翻译模型。")
              argostranslate.package.update_package_index()
              package = next(
                  package
                  for package in argostranslate.package.get_available_packages()
                  if package.from_code == "en" and package.to_code == "zh"
              )
              argostranslate.package.install_from_path(package.download())
              print("离线中英翻译模型安装完成。")
          PY

      - name: Run news aggregator
        run: python scripts/aggregator.py

      - name: Commit and push data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Daily news: $(date +%Y-%m-%d)"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin main
          fi

      # Bark 推送已迁移至 macOS 本地定时任务（noon_push.py + launchd）
      # 确保每天中午 12:00 北京时间准时推送，不受 GitHub Actions 调度延迟影响
