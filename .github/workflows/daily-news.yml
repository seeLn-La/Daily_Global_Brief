name: Daily News Aggregation

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = 北京时间 7:00（提前1h缓冲GitHub延迟）
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run news aggregator
        run: python scripts/aggregator.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Daily news: $(date +%Y-%m-%d)"
            git push
          fi

      - name: Send Bark notification
        if: always()
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          PAGES_URL: https://seeln-la.github.io/news/
        run: python scripts/bark_pusher.py
